aid: yazio
name: YAZIO
description: 'YAZIO GmbH is an Erfurt, Germany based digital health company whose nutrition
  app pairs calorie and macro tracking with barcode scanning, AI photo food logging,
  an intermittent-fasting timer, a 3,000-recipe library and body-metric tracking across
  iOS, Android and the web. The company describes itself as remote-first, cites more
  than 100 million downloads across over 150 countries, and sells a freemium product:
  a free tier plus a "YAZIO PRO" subscription transacted through the Apple App Store
  and Google Play rather than through a pricing page on yazio.com. YAZIO publishes
  no developer program of any kind — no developer portal, no API reference, no OpenAPI,
  AsyncAPI or GraphQL contract, no SDKs, no CLI, no MCP server, no changelog, no status
  page and no security.txt. Its apps talk to a private backend at https://yzapi.yazio.com,
  which is live but answers 401 with an empty body to anonymous requests and issues
  OAuth client credentials through no public process. Every YAZIO OpenAPI description,
  client library and MCP server in circulation is third-party reverse-engineering that
  states in its own README that it is unofficial and unaffiliated.'
